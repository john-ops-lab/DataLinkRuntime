# Linux-only opt-in override for the Batch 3 Worker resource contract.
#
# DLR_SANDBOX_CGROUP_PARENT and DLR_SANDBOX_CGROUP_SOURCE must both be derived
# from the same fresh system-manager transient unit ControlGroup.  The source
# is one delegated subtree, never the cgroup filesystem root; the container
# path is fixed to the ordinary /run/dlr-cgroup mount below.
services:
  worker:
    labels:
      - "dlr.task=${DLR_TASK_ID:-issue130-b3-20260902}"
    privileged: false
    # The Worker must share the host cgroup namespace so the supervisor can
    # migrate payloads into the exact delegated subtree bind below. The Adapter
    # still hides cgroupfs in its own private mount namespace.
    cgroup: host
    # The Worker supervisor runs as the default container root so it matches
    # the root-owned exact systemd delegated subtree. The trusted supervisor
    # receives exactly the three capabilities needed for namespace/cgroup work
    # and the irreversible payload identity drop, then drops all capabilities
    # before starting each Adapter payload (uid/gid 501:1000).
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
      # Colima's docker-default AppArmor profile denies the mount propagation
      # and tmpfs syscalls required by the Worker helper. This opt-in applies
      # only to the sandbox Worker; seccomp remains Docker's default profile.
      - apparmor=unconfined
    environment:
      # /sys/fs/cgroup is Docker's own read-only cgroup mount.  Bind the exact
      # delegated subtree at an existing ordinary mountpoint instead of
      # asking OCI to create a child below that read-only mount.
      DLR_SANDBOX_CGROUP_PATH: /run/dlr-cgroup
      DLR_SANDBOX_PAYLOAD_UID: "${DLR_SANDBOX_PAYLOAD_UID:-501}"
      DLR_SANDBOX_PAYLOAD_GID: "${DLR_SANDBOX_PAYLOAD_GID:-1000}"
    cgroup_parent: "${DLR_SANDBOX_CGROUP_PARENT:?set the exact systemd ControlGroup}"
    volumes:
      - type: bind
        source: "${DLR_SANDBOX_CGROUP_SOURCE:?set the exact systemd ControlGroup path}"
        target: /run/dlr-cgroup
        read_only: false
        bind:
          create_host_path: false

volumes:
  dlr_artifact_store:
    labels:
      ao.session: "${AO_SESSION_ID:-compose}"
      dlr.task: "${DLR_TASK_ID:-issue130-b3-20260902}"
  dlr_pg_data:
    labels:
      ao.session: "${AO_SESSION_ID:-compose}"
      dlr.task: "${DLR_TASK_ID:-issue130-b3-20260902}"
  dlr_rabbitmq_data:
    labels:
      ao.session: "${AO_SESSION_ID:-compose}"
      dlr.task: "${DLR_TASK_ID:-issue130-b3-20260902}"
  dlr_worker_runtime:
    labels:
      ao.session: "${AO_SESSION_ID:-compose}"
      dlr.task: "${DLR_TASK_ID:-issue130-b3-20260902}"
  dlr_worker_journal:
    labels:
      ao.session: "${AO_SESSION_ID:-compose}"
      dlr.task: "${DLR_TASK_ID:-issue130-b3-20260902}"

networks:
