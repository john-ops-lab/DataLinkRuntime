# DataLinkRuntime M5.11 Wave B platform service logs.
# Install this file under /etc/logrotate.d/dlr-platform-logs after changing
# the root if DLR_PLATFORM_LOG_ROOT is not /var/lib/dlr/platform-logs.
#
# The postrotate helper is installed separately because logrotate cannot know
# the Compose project or file location. It reopens Nginx and asks PostgreSQL's
# collector to rotate through pg_rotate_logfile(); Control and Worker reopen
# automatically through WatchedFileHandler.

/var/lib/dlr/platform-logs/control/*.log
/var/lib/dlr/platform-logs/worker/*.log
/var/lib/dlr/platform-logs/web/*.log
/var/lib/dlr/platform-logs/account-web/*.log {
    daily
    maxsize 50M
    rotate 14
    maxage 14
    compress
    delaycompress
    missingok
    notifempty
    create 0640 root root
    sharedscripts
    postrotate
        /usr/local/sbin/dlr-platform-logs-postrotate
    endscript
}

/var/lib/dlr/platform-logs/postgres/*.log {
    daily
    maxsize 50M
    rotate 14
    maxage 14
    compress
    delaycompress
    missingok
    notifempty
    # Do not create this file as the host's root user. The postrotate helper
    # asks PostgreSQL to create the next file with the collector's own 0600
    # ownership inside the container.
    sharedscripts
    postrotate
        /usr/local/sbin/dlr-platform-logs-postrotate
    endscript
}
