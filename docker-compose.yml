services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dlr
      POSTGRES_PASSWORD: dlr
      POSTGRES_DB: dlr
    volumes:
      - dlr_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dlr -d dlr"]
      interval: 5s
      timeout: 3s
      retries: 12

  control:
    build:
      context: .
      dockerfile: docker/control.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://dlr:dlr@postgres:5432/dlr
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      DLR_WORKER_READY_FILE: /tmp/dlr-worker.ready
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys; sys.exit(0 if os.path.exists(os.environ.get('DLR_WORKER_READY_FILE', '/tmp/dlr-worker.ready')) else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      control:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  dlr_pg_data:
