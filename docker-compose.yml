services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    labels:
      - "ao.session=${AO_SESSION_ID:-compose}"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: dlr
      POSTGRES_PASSWORD: dlr
      POSTGRES_DB: dlr
      DLR_PLATFORM_LOG_ROOT: /var/lib/dlr/platform-logs
    command:
      - postgres
      - -c
      - logging_collector=on
      - -c
      - log_directory=/var/lib/dlr/platform-logs/postgres
      - -c
      - log_filename=postgresql-%Y-%m-%d_%H%M%S.log
      - -c
      - log_rotation_age=1d
      - -c
      - log_rotation_size=50MB
    volumes:
      - dlr_pg_data:/var/lib/postgresql/data
      - ${DLR_PLATFORM_LOG_ROOT:-/var/lib/dlr/platform-logs}/postgres:/var/lib/dlr/platform-logs/postgres
    healthcheck:
      test: ["CMD-SHELL", "psql --no-psqlrc --quiet -w -v ON_ERROR_STOP=1 -U dlr -d dlr -c 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12

  control:
    build:
      context: .
      dockerfile: docker/control.Dockerfile
    labels:
      - "ao.session=${AO_SESSION_ID:-compose}"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    # M5.5.8: DNS fallback for containers that need external services. The
    # Docker embedded resolver (127.0.0.11) stays first so internal service
    # names keep resolving; 1.1.1.1 / 8.8.8.8 are only fallbacks when the
    # host DNS cannot resolve a public domain (enterprise / VPN). Override
    # via .env (e.g. DLR_DNS_FALLBACK_1=10.0.0.53) or set both fallbacks to
    # empty to disable the public fallback entirely.
    dns:
      - ${DLR_DNS_PRIMARY:-127.0.0.11}
      - ${DLR_DNS_FALLBACK_1-1.1.1.1}
      - ${DLR_DNS_FALLBACK_2-8.8.8.8}
    environment:
      DATABASE_URL: postgresql+psycopg://dlr:dlr@postgres:5432/dlr
      # M2 static shared tokens; must come from the environment / .env file,
      # never hardcoded here (see .env.example).
      DLR_ADMIN_TOKEN: ${DLR_ADMIN_TOKEN:?set DLR_ADMIN_TOKEN (see .env.example)}
      DLR_WORKER_TOKEN: ${DLR_WORKER_TOKEN:?set DLR_WORKER_TOKEN (see .env.example)}
      # M4.1 effective-online timeout; must stay above the Worker heartbeat interval.
      DLR_WORKER_HEARTBEAT_TIMEOUT_SECONDS: ${DLR_WORKER_HEARTBEAT_TIMEOUT_SECONDS:-30}
      # M3.2 Secret Store master key: derives the Fernet key for credential
      # encryption. Only Control decrypts (at claim time); never persisted.
      # Empty by default: credential APIs stay disabled (503) until the
      # operator explicitly configures a deployment-specific key.
      DLR_MASTER_KEY: ${DLR_MASTER_KEY:-}
      # Issue #127 B4: the ArtifactStore is a Control-owned persistent volume.
      # Keep the application root and named-volume target on the same
      # interpolation so an explicit deployment override cannot drift into a
      # different storage authority.
      DLR_ARTIFACT_STORE_ROOT: ${DLR_ARTIFACT_STORE_ROOT:-/var/lib/dlr/artifacts}
      DLR_MANAGED_FILES_ENABLED: ${DLR_MANAGED_FILES_ENABLED:-false}
      DLR_ARTIFACT_DELETE_ALERT_THRESHOLD: ${DLR_ARTIFACT_DELETE_ALERT_THRESHOLD:-5}
      DLR_ARTIFACT_GC_INTERVAL_SECONDS: ${DLR_ARTIFACT_GC_INTERVAL_SECONDS:-300}
      DLR_ARTIFACT_AUDIT_INTERVAL_SECONDS: ${DLR_ARTIFACT_AUDIT_INTERVAL_SECONDS:-3600}
      # Issue #127 Wave C: bounded protocol/recovery settings. These values
      # are snapshotted into new Executions by Control.
      DLR_MIN_WORKER_PROTOCOL_VERSION: ${DLR_MIN_WORKER_PROTOCOL_VERSION:-1}
      DLR_EXECUTION_CLAIM_TIMEOUT_SECONDS: ${DLR_EXECUTION_CLAIM_TIMEOUT_SECONDS:-300}
      DLR_EXECUTION_RECOVERY_GRACE_SECONDS: ${DLR_EXECUTION_RECOVERY_GRACE_SECONDS:-60}
      DLR_WORKSPACE_CLEANUP_ATTEMPT_TIMEOUT_SECONDS: ${DLR_WORKSPACE_CLEANUP_ATTEMPT_TIMEOUT_SECONDS:-5}
      DLR_WORKSPACE_CLEANUP_TOTAL_TIMEOUT_SECONDS: ${DLR_WORKSPACE_CLEANUP_TOTAL_TIMEOUT_SECONDS:-20}
      # M4 non-streaming Provider request deadline; Settings enforces 10..600s.
      DLR_AI_PROVIDER_TIMEOUT_SECONDS: ${DLR_AI_PROVIDER_TIMEOUT_SECONDS:-180}
      # M5.2 Schedule Trigger: Control scheduler polling interval (0.5..300s).
      DLR_SCHEDULE_POLL_SECONDS: ${DLR_SCHEDULE_POLL_SECONDS:-5}
      # M5.11 Wave B: the host-side bind root is expanded by Compose; the
      # application always writes under this fixed in-container path.
      DLR_PLATFORM_LOG_ROOT: /var/lib/dlr/platform-logs
      DLR_AI_TOOL_AUDIT_MAX_BYTES: ${DLR_AI_TOOL_AUDIT_MAX_BYTES:-10485760}
      DLR_AI_TOOL_AUDIT_BACKUP_COUNT: ${DLR_AI_TOOL_AUDIT_BACKUP_COUNT:-10}
      DLR_EXECUTION_RETENTION_WEBHOOK_DAYS: ${DLR_EXECUTION_RETENTION_WEBHOOK_DAYS:-30}
      DLR_EXECUTION_RETENTION_WEBHOOK_MAX_PER_ADAPTER: ${DLR_EXECUTION_RETENTION_WEBHOOK_MAX_PER_ADAPTER:-100}
      DLR_EXECUTION_RETENTION_TASK_DAYS: ${DLR_EXECUTION_RETENTION_TASK_DAYS:-30}
      DLR_EXECUTION_RETENTION_TASK_MAX_PER_ADAPTER: ${DLR_EXECUTION_RETENTION_TASK_MAX_PER_ADAPTER:-1000}
      DLR_EXECUTION_RETENTION_SCHEDULE_DAYS: ${DLR_EXECUTION_RETENTION_SCHEDULE_DAYS:-90}
      DLR_EXECUTION_RETENTION_SCHEDULE_MAX_PER_ADAPTER: ${DLR_EXECUTION_RETENTION_SCHEDULE_MAX_PER_ADAPTER:-1000}
      DLR_EXECUTION_RETENTION_BATCH_SIZE: ${DLR_EXECUTION_RETENTION_BATCH_SIZE:-100}
      DLR_EXECUTION_RETENTION_INTERVAL_SECONDS: ${DLR_EXECUTION_RETENTION_INTERVAL_SECONDS:-3600}
      # M5.7 Wave C2: read-only KnowledgeSource (first target: Tencent ima).
      # The endpoint must be HTTPS on the official host allowlist in
      # production; DLR_IMA_ALLOW_HTTP is the explicit test/smoke escape
      # hatch (fake official service on a private network only). Client ID /
      # API Key / Token come from a DLR Credential (Secret Store) referenced
      # by DLR_IMA_CREDENTIAL_NAME — never from plaintext env. The product
      # default is the official endpoint; a custom endpoint is deployment-only.
      DLR_IMA_ENDPOINT: ${DLR_IMA_ENDPOINT-https://ima.qq.com}
      DLR_IMA_CREDENTIAL_NAME: ${DLR_IMA_CREDENTIAL_NAME:-}
      DLR_IMA_ALLOWED_HOSTS: ${DLR_IMA_ALLOWED_HOSTS:-ima.qq.com}
      DLR_IMA_ALLOW_HTTP: ${DLR_IMA_ALLOW_HTTP:-false}
      DLR_IMA_TIMEOUT_SECONDS: ${DLR_IMA_TIMEOUT_SECONDS:-8}
    volumes:
      - dlr_artifact_store:${DLR_ARTIFACT_STORE_ROOT:-/var/lib/dlr/artifacts}
      - ${DLR_PLATFORM_LOG_ROOT:-/var/lib/dlr/platform-logs}/control:/var/lib/dlr/platform-logs/control
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    labels:
      - "ao.session=${AO_SESSION_ID:-compose}"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    # The Worker long-polls claim for up to 20s; Docker's default 10s grace
    # would kill it before _graceful_offline() can run. 30s covers the worst
    # case claim wait plus a buffer for the offline notification.
    stop_grace_period: 30s
    # Same M5.5.8 DNS fallback as control (embedded resolver first).
    dns:
      - ${DLR_DNS_PRIMARY:-127.0.0.11}
      - ${DLR_DNS_FALLBACK_1-1.1.1.1}
      - ${DLR_DNS_FALLBACK_2-8.8.8.8}
    environment:
      DLR_WORKER_READY_FILE: /tmp/dlr-worker.ready
      DLR_CONTROL_URL: http://control:8000
      DLR_WORKER_TOKEN: ${DLR_WORKER_TOKEN:?set DLR_WORKER_TOKEN (see .env.example)}
      DLR_WORKER_NAME: ${DLR_WORKER_NAME:-worker-1}
      DLR_WORKER_PROTOCOL_VERSION: ${DLR_WORKER_PROTOCOL_VERSION:-1}
      DLR_WORKER_HEARTBEAT_SECONDS: ${DLR_WORKER_HEARTBEAT_SECONDS:-10}
      DLR_RUNTIME_ROOT: /var/lib/dlr/runtime
      DLR_WORKSPACE_CLEANUP_JOURNAL_ROOT: /var/lib/dlr/journal
      DLR_PLATFORM_LOG_ROOT: /var/lib/dlr/platform-logs
      # Optional compatibility fallbacks. Platform-managed default dependency
      # sources take precedence and are selected by Adapter language.
      DLR_PYPI_INDEX_URL: ${DLR_PYPI_INDEX_URL:-}
      DLR_NPM_REGISTRY_URL: ${DLR_NPM_REGISTRY_URL:-}
      DLR_MAVEN_REPOSITORY_URL: ${DLR_MAVEN_REPOSITORY_URL:-}
      # Runtime secrets are injected into the Worker only; the Adapter
      # subprocess still only sees DLR_SECRET_* (never tokens or DATABASE_URL).
      DLR_SECRET_SMOKE: ${DLR_SECRET_SMOKE:-local-dev-secret}
    volumes:
      - dlr_worker_runtime:/var/lib/dlr/runtime
      - dlr_worker_journal:/var/lib/dlr/journal
      - ${DLR_PLATFORM_LOG_ROOT:-/var/lib/dlr/platform-logs}/worker:/var/lib/dlr/platform-logs/worker
    depends_on:
      control:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys; sys.exit(0 if os.path.exists(os.environ.get('DLR_WORKER_READY_FILE', '/tmp/dlr-worker.ready')) else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    labels:
      - "ao.session=${AO_SESSION_ID:-compose}"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ${DLR_PLATFORM_LOG_ROOT:-/var/lib/dlr/platform-logs}/web:/var/lib/dlr/platform-logs/web
    ports:
      - "${DLR_WEB_HOST_PORT:-8080}:80"
    depends_on:
      control:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Account entry: same built SPA image, Control service and PostgreSQL as the
  # legacy Token entry. Only the reverse-proxy boundary differs.
  account-web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    labels:
      - "ao.session=${AO_SESSION_ID:-compose}"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ${DLR_PLATFORM_LOG_ROOT:-/var/lib/dlr/platform-logs}/account-web:/var/lib/dlr/platform-logs/account-web
    command: ["nginx", "-c", "/etc/nginx/nginx-account.conf", "-g", "daemon off;"]
    ports:
      - "${DLR_ACCOUNT_WEB_HOST_PORT:-8081}:80"
    depends_on:
      control:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  # Issue #127 B4: LocalFileArtifactStore is deliberately single-Writer;
  # only the Control service mounts this volume.
  dlr_artifact_store:
  dlr_pg_data:
  dlr_worker_runtime:
  dlr_worker_journal:
