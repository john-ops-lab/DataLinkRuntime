name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # M1 backend tests run against real PostgreSQL (never SQLite) so the
      # Alembic migration chain, JSONB and FK behavior are exercised for real.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dlr
          POSTGRES_PASSWORD: dlr
          POSTGRES_DB: dlr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dlr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://dlr:dlr@localhost:5432/dlr
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install dependencies (locked)
        run: uv sync --frozen
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies (locked)
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Vitest
        run: npm run test
      - name: Build
        run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run compose smoke test
        run: ./scripts/compose-smoke.sh
