[project]
name = "dlr"
version = "0.0.1"
description = "DataLinkRuntime: lightweight data adapter runtime platform"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    # M5.7 Wave B2 attachments: server-side PDF text fallback. Pure-Python
    # (headless-friendly), BSD-3-Clause, actively maintained, no transitive
    # runtime dependencies; the ~0.4MB wheel is the minimal PDF parser that
    # can extract real text. DOCX/text/code fallback uses only the stdlib.
    "pypdf>=6.0,<7",
    "cryptography>=43",
    "croniter>=6",
    "tzdata>=2024",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dlr"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["dlr"]

[[tool.mypy.overrides]]
# croniter ships no type annotations.
module = ["croniter"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
