server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # This browser value only selects the matching login surface. API
    # authorization uses the server-side entry boundary, not this value.
    location = /entry-mode.js {
        default_type application/javascript;
        add_header Cache-Control "no-store";
        return 200 'window.__DLR_ENTRY_MODE__="token";';
    }

    # SSE event stream of one Execution: buffering must stay disabled and the
    # read timeout must cover long-running executions plus keepalive gaps.
    location ~ ^/api/executions/\d+/events$ {
        proxy_pass http://control:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # Proxy platform API to the Control Node.
    location /api/ {
        proxy_pass http://control:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback.
    location / {
        try_files $uri /index.html;
    }
}
