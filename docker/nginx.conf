# Keep the persistent access copy free of query strings, Authorization,
# Cookie and request bodies. Docker stdout remains a bounded fallback; the
# bind-mounted files are the platform-log source of truth.
log_format dlr_access '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                      '"$http_user_agent"';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    access_log /var/lib/dlr/platform-logs/web/access.log dlr_access;
    error_log /var/lib/dlr/platform-logs/web/error.log warn;

    # This browser value only selects the matching login surface. API
    # authorization uses the server-side entry boundary, not this value.
    location = /entry-mode.js {
        default_type application/javascript;
        add_header Cache-Control "no-store";
        return 200 'window.__DLR_ENTRY_MODE__="token";';
    }

    # SSE event stream of one Execution: buffering must stay disabled and the
    # read timeout must cover long-running executions plus keepalive gaps.
    location ~ ^/api/executions/\d+/events$ {
        proxy_pass http://control:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # Assist requests carry bounded attachment JSON and may wait for a model
    # round longer than ordinary API calls. Keep this boundary explicit so a
    # non-JSON gateway 413/504 still reaches the Web fallback handler.
    location ~ ^/api/adapters/\d+/ai/assist$ {
        # 48 MiB decoded attachments expand to roughly 64 MiB in base64 JSON.
        client_max_body_size 72m;
        proxy_pass http://control:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 660s;
    }

    # Proxy platform API to the Control Node.
    location /api/ {
        proxy_pass http://control:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback.
    location / {
        try_files $uri /index.html;
    }
}
