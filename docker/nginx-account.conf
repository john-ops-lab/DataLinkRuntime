events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Do not persist query strings, Authorization, Cookie or request bodies.
    log_format dlr_access '$remote_addr - $remote_user [$time_local] '
                          '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                          '"$http_user_agent"';

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;
        access_log /var/lib/dlr/platform-logs/account-web/access.log dlr_access;
        error_log /var/lib/dlr/platform-logs/account-web/error.log warn;

        # The public browser value only selects the account UI. Control
        # authorization relies on the private URI rewrite below instead.
        location = /entry-mode.js {
            default_type application/javascript;
            add_header Cache-Control "no-store";
            return 200 'window.__DLR_ENTRY_MODE__="account";';
        }

        # Account traffic enters Control through a private marker prefix. The
        # Control container has no host port, and the token Nginx config never
        # proxies this prefix, so a browser cannot select the other boundary.
        location ~ ^/api/executions/\d+/events$ {
            rewrite ^/api/(.*)$ /__dlr_account/api/$1 break;
            proxy_pass http://control:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
        }

        # Keep the account entry boundary identical to the token surface:
        # attachment bodies are capped by Nginx and long assist rounds are not
        # cut off before Control can return its sanitized response.
        location ~ ^/api/adapters/\d+/ai/assist$ {
            rewrite ^/api/(.*)$ /__dlr_account/api/$1 break;
            client_max_body_size 32m;
            proxy_pass http://control:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 660s;
        }

        location /api/ {
            rewrite ^/api/(.*)$ /__dlr_account/api/$1 break;
            proxy_pass http://control:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
