[project]
name = "dlr-ai-migration-probe"
version = "0.0.1"
description = "Isolated Issue 213 B0 experiments; not a production runtime"
requires-python = ">=3.13,<3.14"
dependencies = [
    "dlr",
    "pydantic-ai-slim[openai,anthropic,google]==2.57.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6", "mypy>=1.11"]

[tool.uv.sources]
dlr = { path = "../../backend", editable = true }

[tool.uv]
constraint-dependencies = [
    "alembic==1.19.1",
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.14.2",
    "ast-serialize==0.8.0",
    "attrs==26.1.0",
    "certifi==2026.7.22",
    "cffi==2.1.1",
    "click==8.4.2",
    "colorama==0.4.6",
    "croniter==6.2.4",
    "cryptography==50.0.0",
    "et-xmlfile==2.0.0",
    "fastapi==0.141.1",
    "greenlet==3.5.5",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httptools==0.8.0",
    "httpx==0.28.1",
    "idna==3.18",
    "iniconfig==2.3.0",
    "jsonschema-specifications==2025.9.1",
    "jsonschema==4.26.0",
    "librt==0.15.0",
    "mako==1.4.1",
    "markupsafe==3.0.3",
    "mypy-extensions==1.1.0",
    "mypy==2.3.0",
    "openpyxl==3.1.5",
    "packaging==26.3",
    "pathspec==1.1.1",
    "pika==1.3.2",
    "pluggy==1.6.0",
    "psycopg-binary==3.3.4",
    "psycopg==3.3.4",
    "pycparser==3.0",
    "pydantic-core==2.46.4",
    "pydantic-settings==2.15.0",
    "pydantic==2.13.4",
    "pygments==2.20.0",
    "pypdf==6.16.1",
    "pytest==9.1.1",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "referencing==0.37.0",
    "rfc8785==0.1.4",
    "rpds-py==2026.6.3",
    "ruff==0.16.2",
    "six==1.17.0",
    "sqlalchemy==2.0.51",
    "starlette==1.6.0",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.3",
    "tzdata==2026.3",
    "uvicorn==0.52.1",
    "uvloop==0.22.1",
    "watchfiles==1.2.0",
    "websockets==16.0",
    "xlrd==2.0.2",
 ]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gap: records a compatibility gap; passing is not a migration-gate PASS"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
follow_imports = "silent"
mypy_path = "$MYPY_CONFIG_FILE_DIR/../../backend/src"
